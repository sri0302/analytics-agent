<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --border: #242428;
    --accent: #7b61ff;
    --text: #e8e8ea;
    --text-dim: #6b6b72;
    --text-muted: #3a3a42;
    --user-bg: #1a1a2e;
    --font-sans: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; }

  .shell { display: flex; flex-direction: column; height: 100vh; max-width: 760px; margin: 0 auto; }

  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: #fff; flex-shrink: 0; }
  .header-text h1 { font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
  .header-text p { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #3ddc84; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; pointer-events: none; }
  .empty-icon { font-size: 28px; opacity: 0.3; margin-bottom: 4px; }
  .empty p { font-size: 13px; color: var(--text-dim); }
  .empty span { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }

  .msg { display: flex; flex-direction: column; gap: 4px; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg-label { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 2px; }
  .msg.user .msg-label { color: var(--accent); opacity: 0.7; }
  .msg-body { padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.65; }
  .msg.user .msg-body { background: var(--user-bg); border-color: rgba(123,97,255,0.2); }
  .msg.agent .msg-body { background: var(--surface); border-color: var(--border); }

  .typing .msg-body { display: flex; align-items: center; gap: 4px; padding: 14px 16px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); animation: blink 1.2s infinite; }
  .dot:nth-child(2){animation-delay:0.2s} .dot:nth-child(3){animation-delay:0.4s}
  @keyframes blink { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

  .input-area { border-top: 1px solid var(--border); padding: 16px 24px 20px; flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font-sans); font-size: 13.5px; line-height: 1.5; padding: 10px 14px; resize: none; outline: none; min-height: 42px; max-height: 140px; overflow-y: auto; transition: border-color 0.15s; }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus { border-color: var(--accent); }
  button { background: var(--accent); border: none; border-radius: 8px; color: #fff; cursor: pointer; padding: 10px 16px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; transition: opacity 0.15s, transform 0.1s; flex-shrink: 0; height: 42px; }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .hint { margin-top: 8px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .hint kbd { background: var(--border); border-radius: 3px; padding: 1px 4px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">Ag</div>
    <div class="header-text">
      <h1>Analytics Agent</h1>
      <p>schema · insights · anomalies</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      ready
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="empty" id="empty">
      <div class="empty-icon">⬡</div>
      <p>No conversation yet</p>
      <span>Ask anything about your schema</span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Ask about your schema..." rows="1" autofocus></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
    <div class="hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line</div>
  </div>
</div>

<script>
  const SYSTEM_PROMPT = `You are a database analyst agent. Analyse schemas and data provided and give specific, actionable insights. Never invent tables or columns. Flag anomalies, suggest optimisations, and explain relationships clearly. Be concise and direct.`;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const emptyEl = document.getElementById('empty');

  let history = [];
  let isLoading = false;

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addMessage(role, content) {
    emptyEl.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'you' : 'agent';
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = content;
    msg.appendChild(label);
    msg.appendChild(body);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping() {
    emptyEl.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = 'msg agent typing';
    msg.id = 'typing';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'agent';
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    msg.appendChild(label);
    msg.appendChild(body);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

  async function sendMessage() {
    const query = inputEl.value.trim();
    if (!query || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', query);
    history.push({ role: 'user', content: query });
    addTyping();

    try {
      const response = await fetch('http://localhost:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: SYSTEM_PROMPT, messages: history })
      });
      const data = await response.json();
      const reply = data.reply || data.error || 'No response.';
      history.push({ role: 'assistant', content: reply });
      removeTyping();
      addMessage('agent', reply);
    } catch (err) {
      removeTyping();
      addMessage('agent', `Error: ${err.message}`);
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
